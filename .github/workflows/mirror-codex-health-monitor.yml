name: Mirror Codex Health Monitor release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-codex-health-monitor.yml"
      - "registry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      VERSION: "0.1.11"
      UPSTREAM_REPO: "hg3386628/codex-health-monitor"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify upstream binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package
          for arch in amd64 arm64; do
            base="https://github.com/${UPSTREAM_REPO}/releases/download/v${VERSION}/codex-health-monitor-linux-${arch}.so"
            curl -fL --retry 3 "${base}" -o "dist/codex-health-monitor-linux-${arch}.so"
            curl -fL --retry 3 "${base}.sha256" -o "dist/codex-health-monitor-linux-${arch}.so.sha256"

            expected="$(awk '{print $1}' "dist/codex-health-monitor-linux-${arch}.so.sha256")"
            actual="$(sha256sum "dist/codex-health-monitor-linux-${arch}.so" | awk '{print $1}')"
            test "${expected}" = "${actual}"

            mkdir -p "package/${arch}"
            cp "dist/codex-health-monitor-linux-${arch}.so" "package/${arch}/codex-health-monitor.so"
            (
              cd "package/${arch}"
              zip -q "../../dist/codex-health-monitor_${VERSION}_linux_${arch}.zip" codex-health-monitor.so
            )
          done

          (
            cd dist
            sha256sum codex-health-monitor_${VERSION}_linux_*.zip > checksums.txt
          )

          cat dist/checksums.txt

      - name: Publish plugin-store compatible release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          assets=(
            "dist/codex-health-monitor_${VERSION}_linux_amd64.zip"
            "dist/codex-health-monitor_${VERSION}_linux_arm64.zip"
            "dist/checksums.txt"
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              --notes "Plugin-store compatible mirror of hg3386628/codex-health-monitor ${tag}."
          fi
